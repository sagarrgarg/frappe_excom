[project]
name = "excom-voice"
version = "0.1.0"
description = "Excom AI voice bridge: telephony media streams <-> speech-to-text / text-to-speech <-> Frappe"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "websockets>=14.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
excom-voice = "excom_voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["excom_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["excom_voice"]

[tool.ruff.lint.per-file-ignores]
# Test helpers poll with explicit timeouts on purpose.
"tests/*" = ["ASYNC109", "ASYNC110"]
